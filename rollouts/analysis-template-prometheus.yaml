apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: prometheus-canary-analysis
  namespace: sa-p8-prod
  labels:
    practice: p10
    governance: prometheus-metrics
spec:
  args:
    - name: canary-hash
      value: "canary"
  metrics:
    # Métrica 1: Tasa de errores HTTP 5xx en el API Gateway durante la fase Canary (SLO <= 2%)
    - name: canary-error-rate-gateway
      interval: 10s
      count: 3
      failureLimit: 1
      successCondition: result[0] <= 0.02
      provider:
        prometheus:
          address: http://prometheus.sa-p8-prod.svc.cluster.local:9090
          query: |
            (
              sum(rate(http_requests_total{app="api-gateway", status=~"5.*", rollouts_pod_template_hash="{{args.canary-hash}}"}[1m]))
              /
              (sum(rate(http_requests_total{app="api-gateway", rollouts_pod_template_hash="{{args.canary-hash}}"}[1m])) > 0)
            ) or vector(0)

    # Métrica 2: Tasa de errores en el microservicio downstream account-service (SLO <= 2%)
    - name: canary-error-rate-account-service
      interval: 10s
      count: 3
      failureLimit: 1
      successCondition: result[0] <= 0.02
      provider:
        prometheus:
          address: http://prometheus.sa-p8-prod.svc.cluster.local:9090
          query: |
            (
              sum(rate(http_requests_total{app="account-service", status=~"5.*", rollouts_pod_template_hash="{{args.canary-hash}}"}[1m]))
              /
              (sum(rate(http_requests_total{app="account-service", rollouts_pod_template_hash="{{args.canary-hash}}"}[1m])) > 0)
            ) or vector(0)

    # Métrica 3: Latencia percentil 95 (p95) de la versión candidata (SLO <= 300ms / 0.300s)
    - name: canary-latency-p95
      interval: 10s
      count: 3
      failureLimit: 1
      successCondition: result[0] <= 0.300
      provider:
        prometheus:
          address: http://prometheus.sa-p8-prod.svc.cluster.local:9090
          query: |
            (
              histogram_quantile(0.95,
                sum(rate(http_request_duration_seconds_bucket{app=~"api-gateway|account-service|auth-service", rollouts_pod_template_hash="{{args.canary-hash}}"}[1m]))
                by (le)
              )
            ) or vector(0.05)
