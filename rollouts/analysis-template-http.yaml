apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: http-success-rate
  namespace: sa-p8-prod
spec:
  metrics:
  - name: success-rate
    interval: 15s
    count: 3
    successCondition: result == '200'
    failureLimit: 1
    provider:
      job:
        spec:
          backoffLimit: 0
          template:
            spec:
              containers:
              - name: curl
                image: curlimages/curl:8.11.0
                command: ["curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "http://sa-api-gateway-prod-api-gateway.sa-p8-prod.svc.cluster.local:8000/health"]
              restartPolicy: Never