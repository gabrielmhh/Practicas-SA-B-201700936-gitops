apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: block-latest-tag
  annotations:
    policies.kyverno.io/title: Prohibir imagen con tag latest
    policies.kyverno.io/description: >-
      Bloquea cualquier Pod que use una imagen con el tag "latest".
      El versionamiento semántico (v1.x.x) es obligatorio.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-image-tag-not-latest
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - sa-p8-dev
                - sa-p8-prod
      validate:
        message: >-
          El uso del tag 'latest' está prohibido por política de seguridad.
          Use un tag semántico explícito como v1.0.0.
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
                  - key: "{{ element.image }}"
                    operator: NotContains
                    value: ":"
